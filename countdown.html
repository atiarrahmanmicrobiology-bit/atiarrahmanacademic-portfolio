<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown to the Ceremony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e2a4a; --panel-a:#44506c; --panel-b:#2f3b5c;
  --tile:rgba(28,36,58,.3); --tile-line:#3d475f; --gold:#c9a84c; --gold-d:#a88a35;
  --ink:#fff; --muted:#e9e2c8; --dark:#1f1a0b;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;display:grid;place-items:center;padding:24px;
  background:var(--bg);
  background-image:repeating-linear-gradient(135deg,transparent 0 46px,rgba(255,255,255,.04) 46px 47px);
  font-family:Inter,system-ui,sans-serif;color:var(--ink);
}
.card{
  width:min(900px,100%);padding:clamp(16px,4vw,38px);border-radius:32px;position:relative;
  background:transparent;
  border:2px solid rgba(255,255,255,.22);
  box-shadow:0 30px 60px rgba(0,0,0,.35);
}
.card::before{display:none;content:"";position:absolute;top:0;left:12%;right:12%;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.icon{width:58px;height:58px;border-radius:16px;background:var(--gold);display:grid;place-items:center;color:var(--dark)}
.title{margin:0;flex:1;min-width:200px;font-size:clamp(14px,2.4vw,22px);font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.date{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;
  background:rgba(30,40,66,.55);border:1.5px solid rgba(255,255,255,.2);color:var(--muted);font-weight:600;font-size:clamp(14px,2vw,22px)}
.row{display:flex;align-items:center;gap:clamp(6px,1.6vw,16px)}
.unit{flex:1;aspect-ratio:1/1.12;border-radius:22px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--tile);border:1.5px solid var(--tile-line);box-shadow:inset 0 2px 0 rgba(255,255,255,.05)}
.unit::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.35)}
.unit.gold{background:linear-gradient(180deg,rgba(226,200,118,.68),rgba(190,160,72,.68));border-color:#ecd98f;color:var(--dark)}
.unit.gold::after{background:rgba(0,0,0,.18)}
.num{font-family:"Playfair Display",Georgia,serif;font-weight:800;line-height:1;
  font-size:clamp(40px,10.5vw,92px);font-variant-numeric:lining-nums tabular-nums;text-shadow:0 4px 10px rgba(0,0,0,.35)}
.gold .num{text-shadow:none}
.secs .num{color:inherit}
.lbl{font-size:clamp(10px,2.1vw,20px);font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.gold .lbl{opacity:.75}
.num.tick{animation:tick .35s ease-out}
@keyframes tick{from{transform:translateY(-12%);opacity:.3}to{transform:none;opacity:1}}
.dots{display:flex;flex-direction:column;gap:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55)}
.done{display:none;text-align:center;font-size:clamp(20px,4vw,32px);font-family:"Playfair Display",serif;padding:24px 0}
@media (max-width:520px){.dots{display:none}.row{gap:8px}.head{gap:12px}.icon{width:46px;height:46px}}
.fsbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;cursor:pointer;font:600 14px Inter,system-ui,sans-serif;color:var(--muted);background:rgba(30,40,66,.7);border:1.5px solid rgba(255,255,255,.25)}
.fsbtn:hover{background:rgba(30,40,66,.95)}
.fsbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.fs{padding:0;height:100vh;overflow:hidden}
body.fs .card{width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-height:0;border-radius:0;border:0;box-shadow:none;display:flex;flex-direction:column;justify-content:center;padding:3vw}
body.fs .num{font-size:min(12vw,21vh)}
body.fs .lbl{font-size:min(2.2vw,3.9vh)}
body.fs .title{font-size:min(2.3vw,4vh)}
body.fs .date{font-size:min(2.2vw,3.9vh)}
@media (prefers-reduced-motion:reduce){.num.tick{animation:none}}

function pad(n){ return String(n).padStart(2,'0'); }
function set(key, val){
  var el = els[key];
  if (el.textContent !== val){
    el.textContent = val;
    el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
  }
}
function update(){
  var diff = Math.max(0, TARGET - now());
  var t = Math.floor(diff / 1000);
  set('d', pad(Math.floor(t / 86400)));
  set('h', pad(Math.floor(t % 86400 / 3600)));
  set('m', pad(Math.floor(t % 3600 / 60)));
  set('s', pad(t % 60));
  if (diff === 0){
    document.getElementById('row').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    clearInterval(timer);
  }
}
var fsBtn = document.getElementById('fsBtn'), fsTxt = document.getElementById('fsTxt');
function setFs(on){
  document.body.classList.toggle('fs', on);
  fsTxt.textContent = on ? 'Exit' : 'Full screen';
}
function toggleFs(){
  var el = document.documentElement;
  if (!document.body.classList.contains('fs')){
    setFs(true);
    try { if (el.requestFullscreen) el.requestFullscreen().catch(function(){}); } catch(e){}
  } else {
    setFs(false);
    try { if (document.fullscreenElement) document.exitFullscreen().catch(function(){}); } catch(e){}
  }
}
fsBtn.addEventListener('click', toggleFs);
document.addEventListener('fullscreenchange', function(){
  if (!document.fullscreenElement) setFs(false);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'f' || e.key === 'F') toggleFs();
  if (e.key === 'Escape' && document.body.classList.contains('fs')) setFs(false);
});
// Real time: correct the device clock using the server's clock, so a wrong device time doesn't matter.
var offset = 0;
function now(){ return Date.now() + offset; }
function syncTime(){
  try {
    var t0 = Date.now();
    fetch(location.href.split('#')[0], {method:'HEAD', cache:'no-store'}).then(function(r){
      var h = r.headers.get('Date');
      if (!h) return;
      var t1 = Date.now();
      offset = (new Date(h).getTime() + 500) - (t0 + t1) / 2;
      update();
    }).catch(function(){});
  } catch(e){}
}
syncTime();
setInterval(syncTime, 300000);
var timer = setInterval(update, 250);
update();
</script>
